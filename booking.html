<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Booking</title>
  </head>
  <body>
    <main>
      <section id="book">
        <h2>Book Your Stay</h2>
        <form action="#confirmation" method="get">
          <label for="fullanme">Full Name:</label><br />
          <input
            type="text"
            name="fullname"
            id="fullname"
            required
          /><br /><br />

          <label for="email">Email Address:</label><br />
          <input type="email" name="email" id="email" required /><br /><br />

          <label for="tel">Phone Number:</label><br />
          <input type="tel" name="tel" id="tel" required /><br /><br />

          <label for="checkIn">Arrival Date:</label><br />
          <input type="date" name="checkIn" id="checkIn" required /><br /><br />

          <label for="guests">Number of Guests:</label><br />
          <select name="guests" id="guests" required>
            <option value="1 guest">1 guest</option>
            <option value="2 guests">2 guests</option>
            <option value="3 guests">3 guests</option>
            <option value="4 guests">4 guests</option>
            <option value="5 guests">5 guests</option>
          </select>
          <br /><br />
          <label for="guests">Room Type:</label><br />
          <select name="guests" id="guests" required>
            <option value="standard">3 STANDARD ROOM</option>
            <option value="premium">PREMIUM ROOM</option>
            <option value="golden">GOLDEN ROOM</option></select
          ><br /><br />

          <label for="special">Special Request</label><br />
          <textarea name="special" id="special" cols="25" rows="4"></textarea
          ><br /><br />

          <input type="submit" value="Book Now" /><br /><br />
        </form>
        <div id="confirmation">
          <h2>✅Booking Confirmed!</h2>
          <p>
            Thank you for choosing DON SAM DE MIRAGE. We are looking forward to
            hosting you!
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
